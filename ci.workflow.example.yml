name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --requirement requirements.txt
      - name: Reject committed API keys
        shell: bash
        run: |
          if git grep -qE 'sk-[A-Za-z0-9_-]{20,}' -- ':!README.md'; then
            echo 'Potential API key detected in tracked files.'
            exit 1
          fi
      - run: python -m py_compile app.py resolver.py xhs_api.py xys.py
      - run: python -m unittest test_stability.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag video-insight:ci .
