# Render 部署配置（Blueprint）
# 用法：打开下面的一键部署链接，Render 会自动读取本文件：
# https://render.com/deploy?repo=https://github.com/esbtejhrfnjyeey432-dev/video-insight
#
# 注意：VI_API_KEY 的值不写在文件里（避免泄露），部署时在 Render 网页里填写。
services:
  - type: web
    name: video-insight
    runtime: python
    plan: free
    region: singapore            # 新加坡节点，访问国内视频平台延迟较低
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VI_API_KEY
        sync: false              # 敏感值：部署时在 Render 网页填写（阿里百炼 Key）
      # 公开模式：任何人打开链接即可直接使用，无需访问码
      - key: VI_PUBLIC
        value: "true"
      # 每日解析上限，防止链接被转发后被刷爆 AI 额度
      - key: VI_DAILY_LIMIT
        value: "50"
      # 免费层内存较小，降低抽帧规格防止 OOM（6 帧是速度/质量平衡点）
      - key: VI_MAX_FRAMES
        value: "6"
      - key: VI_FRAME_WIDTH
        value: "640"
      - key: VI_MAX_VIDEO_MB
        value: "200"
      # 并发分池：本地上传与帧解析走轻量池（4 路并行），互不阻塞；
      # 链接下载与全片拆解是重活，限制并发防止免费层 OOM。
      - key: VI_MAX_FRAME_CONCURRENT
        value: "4"
      - key: VI_MAX_UPLOAD_CONCURRENT
        value: "4"
      - key: VI_MAX_LINK_CONCURRENT
        value: "2"
      - key: VI_MAX_CREATIVE_CONCURRENT
        value: "2"
      - key: VI_QUEUE_TIMEOUT
        value: "60"
      # 二创九宫格属于付费生图：每位访客累计体验 2 元，并设全站每日预算兜底。
      - key: VI_GRID_FREE_LIMIT_CNY
        value: "2.00"
      - key: VI_GRID_DAILY_BUDGET_CNY
        value: "10.00"
      - key: VI_GRID_SERVICE_FEE_CNY
        value: "0.10"
      # 九宫格付款审核后台口令（有口令者可在 payment-admin.html 批准/拒绝订单）。
      # 注意：本文件在公开仓库中，此口令会被看到；建议部署后到 Render 网页改成更复杂的值。
      - key: VI_PAYMENT_ADMIN_TOKEN
        value: "2026"
      # 生产环境关闭内部解析诊断接口，避免被滥用为下载器或网络探针
      - key: VI_ENABLE_DEBUG
        value: "false"
